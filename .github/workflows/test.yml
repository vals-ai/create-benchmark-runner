name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          version: "0.13.5"
      # The create-benchmark-service dependency is a private vals-ai git repo;
      # rewrite its URL so uv can clone it with the workflow token.
      - name: Authorize private vals-ai git deps
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/vals-ai/".insteadOf "https://github.com/vals-ai/"
      - run: uv sync
      - run: uv run pytest tests/ -q
      - run: uv run ruff check src/ tests/
